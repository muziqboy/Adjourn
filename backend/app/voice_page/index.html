<!doctype html>
<!--
  Adjourn's voice and face in the meeting. Recall's bot loads this page as its camera and
  microphone (Output Media): what it shows is the bot's tile, what it plays the meeting hears.

  It decides nothing. backend/app/listen/floor.py is the mind; it sends over /voice/ws:
    {"type": "say", "text"}          speak these words (Gemini Live, voice only)
    {"type": "stop"}                 someone started talking: stop now
    {"type": "hand", "up", "point"}  raise or lower the hand on the tile
  and gets back {"type": "spoken"} when a line has finished playing, plus log lines.
  Gemini Live never hears the meeting, so it cannot react to chatter on its own.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Adjourn voice</title>
<style>
  :root { --bg1: #0f1115; --bg2: #1b1f2a; --text: #f1f3f4; --muted: #9aa0a6;
          --blue: #8ab4f8; --green: #81c995; --amber: #fdd663; --red: #f28b82; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; color: var(--text);
               font-family: "Google Sans", "Helvetica Neue", Arial, sans-serif;
               background: radial-gradient(1200px 700px at 50% 40%, var(--bg2), var(--bg1)); }
  .stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 34px; }

  /* the orb */
  .orb-wrap { position: relative; width: 300px; height: 300px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--blue); opacity: 0;
          transform: scale(calc(1 + var(--level, 0) * 0.35)); transition: transform 80ms, opacity 200ms; }
  .orb { width: 220px; height: 220px; border-radius: 50%;
         background: radial-gradient(circle at 35% 30%, #c6dafc 0%, var(--blue) 35%, #1a73e8 75%, #0b3a8c 100%);
         box-shadow: 0 0 80px rgba(138,180,248,.35); animation: breathe 4s ease-in-out infinite;
         transition: background 300ms, box-shadow 300ms; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
  .listening .ring { opacity: .45; }

  /* speaking: green orb + bars */
  .speaking .orb { background: radial-gradient(circle at 35% 30%, #d2f0db 0%, var(--green) 35%, #188038 80%, #0b4a20 100%);
                   box-shadow: 0 0 110px rgba(129,201,149,.5); animation: none; }
  .bars { position: absolute; bottom: -10px; display: flex; gap: 10px; height: 70px; align-items: flex-end; opacity: 0; transition: opacity 200ms; }
  .bars span { width: 12px; border-radius: 6px; background: var(--green); height: 10px; transition: height 70ms; }
  .speaking .bars { opacity: 1; }

  /* raised hand */
  /* raised hand: the hand takes the orb's place, an amber ring pulses around it */
  .hand { position: absolute; width: 210px; height: 210px; opacity: 0; transform: translateY(50px) scale(.6);
          transition: opacity 250ms, transform 400ms cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 12px 36px rgba(253,214,99,.5));
          transform-origin: 50% 90%; z-index: 2; }
  .hand-up .hand { opacity: 1; transform: none; animation: wave 1.6s ease-in-out 400ms infinite; }
  @keyframes wave { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-14deg) } 75% { transform: rotate(10deg) } }
  .hand-up .orb { opacity: 0; transform: scale(.6); animation: none; }
  .hand-up .ring { opacity: 1; border-color: var(--amber); border-width: 4px; animation: halo 1.6s ease-out infinite; }
  @keyframes halo { 0% { transform: scale(.85); opacity: .9 } 100% { transform: scale(1.25); opacity: 0 } }
  .orb { transition: background 300ms, box-shadow 300ms, opacity 250ms, transform 300ms; }

  .error .orb { background: radial-gradient(circle at 35% 30%, #fce8e6 0%, var(--red) 40%, #c5221f 100%); animation: none; }

  /* text */
  .status { font-size: 58px; font-weight: 700; letter-spacing: -0.5px; text-align: center; }
  .hint { font-size: 34px; color: var(--muted); max-width: 1080px; text-align: center; min-height: 84px; line-height: 1.25; }
  .hand-up .hint { color: var(--amber); }
  .badge { position: absolute; left: 44px; bottom: 36px; display: flex; align-items: center; gap: 14px;
           font-size: 30px; font-weight: 700; color: var(--text); background: rgba(255,255,255,.07);
           padding: 12px 22px 12px 16px; border-radius: 40px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
  .brand { position: absolute; right: 44px; bottom: 44px; font-size: 24px; color: var(--muted); }
</style>
</head>
<body class="listening">
<div class="stage">
  <div class="orb-wrap">
    <img class="hand" alt="" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/270b.svg" />
    <div class="ring" id="ring"></div>
    <div class="orb"></div>
    <div class="bars" id="bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <div class="status" id="status">Starting…</div>
  <div class="hint" id="hint">Say “Adjourn, …” to ask me anything</div>
</div>
<div class="badge"><span class="dot"></span>Adjourn</div>
<div class="brand">AI participant · answers when asked</div>

<script type="module">
import { GoogleGenAI, Modality } from "https://cdn.jsdelivr.net/npm/@google/genai@latest/+esm";

const token = new URLSearchParams(location.search).get("token");
const $ = (id) => document.getElementById(id);
let ws = null;
const send = (obj) => { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };
const log = (msg) => { console.log(msg); send({ type: "log", msg: String(msg) }); };

// ---- the tile ----
let handUp = false, handPoint = "";
function setState(state, status, hint) {
  document.body.className = state;
  $("status").textContent = status;
  if (hint !== undefined) $("hint").textContent = hint;
}
function idle() {
  if (handUp) setState("hand-up", "I have something to add", "Say “Go ahead, Adjourn”");
  else setState("listening", "Listening", "Say “Adjourn, …” to ask me anything");
}

// ---- playback of Gemini's 24 kHz PCM, queued back to back ----
const out = new AudioContext({ sampleRate: 24000 });
const analyser = out.createAnalyser();
analyser.fftSize = 256;
analyser.connect(out.destination);
let playHead = 0, line = 0, playingLine = 0, turnDone = true;
const playing = new Set();
function play(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const pcm = new Int16Array(bytes.buffer);
  const buf = out.createBuffer(1, pcm.length, 24000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = out.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  playHead = Math.max(playHead, out.currentTime + 0.05);
  src.start(playHead);
  playHead += buf.duration;
  playing.add(src);
  src.onended = () => { playing.delete(src); maybeDone(); };
}
function maybeDone() {
  if (playing.size === 0 && turnDone && playingLine) { playingLine = 0; send({ type: "spoken" }); idle(); }
}
function stopPlayback() {
  for (const src of playing) { try { src.stop(); } catch {} }
  playing.clear();
  playHead = 0;
  if (playingLine) { playingLine = 0; send({ type: "spoken" }); }
  idle();
}

// sound bars follow Adjourn's voice
const bars = [...$("bars").children];
const levels = new Uint8Array(analyser.frequencyBinCount);
(function draw() {
  analyser.getByteFrequencyData(levels);
  bars.forEach((bar, i) => { bar.style.height = `${10 + (levels[3 + i * 4] / 255) * 60}px`; });
  requestAnimationFrame(draw);
})();

// ---- the take gate: the first moments of each line wait for its transcript --------------
// If the voice starts talking ABOUT the line ("The user wants me to read...") instead of saying
// it, the take is dropped unheard and the line is sent again once.
const META = /^\W*(the user|user wants|i (must|will|should|need to|am going to)|okay,? (so|i)|let me|here is|reading|word for word|as adjourn)/i;
const GATE_MS = 600;
let gate = null;  // {chunks, timer, text, retried}
function openGate() {
  if (!gate || gate.open) return;
  clearTimeout(gate.timer); gate.open = true;
  gate.chunks.forEach(play); gate.chunks = [];
}
function gatedAudio(b64) {
  if (!gate) return play(b64);
  if (gate.open) return play(b64);
  gate.chunks.push(b64);
  if (!gate.timer) gate.timer = setTimeout(openGate, GATE_MS);
}
function gatedText(text) {
  if (!gate || gate.open) return;
  gate.heard = (gate.heard || "") + text;
  if (META.test(gate.heard)) {
    log(`voice narrated instead of speaking, ${gate.retried ? "dropped" : "retrying"}: ${gate.heard.slice(0, 80)}`);
    clearTimeout(gate.timer);
    const retry = !gate.retried, line_text = gate.text;
    gate = null; line += 1;
    if (retry) say(line_text, true); else { playingLine = 0; send({ type: "spoken" }); idle(); }
  } else if (gate.heard.trim().split(/\s+/).length >= 4) openGate();
}

// ---- Gemini Live as a voice: text in, speech out ----
let session = null, said = "";
async function connectVoice() {
  const info = await fetch(`/voice/session?token=${token}`, { method: "POST" }).then((r) => r.json());
  const ai = new GoogleGenAI({ apiKey: info.token, httpOptions: { apiVersion: "v1alpha" } });
  session = await ai.live.connect({
    model: info.model,
    config: { responseModalities: [Modality.AUDIO] },
    callbacks: {
      onopen: () => log("voice ready"),
      onmessage: (m) => {
        const sc = m.serverContent;
        if (!sc) return;
        if (playingLine !== line) return;  // a stopped line's leftover audio
        for (const part of sc.modelTurn?.parts ?? []) if (part.inlineData?.data) gatedAudio(part.inlineData.data);
        if (sc.outputTranscription?.text) { said += sc.outputTranscription.text; gatedText(sc.outputTranscription.text); }
        if (sc.turnComplete) { openGate(); gate = null; turnDone = true; log(`spoke: ${said}`); said = ""; maybeDone(); }
      },
      onerror: (e) => log(`voice error: ${e.message ?? e}`),
      onclose: (e) => { log(`voice closed: ${e.code} ${e.reason}`); session = null; setTimeout(connectVoice, 1000); },
    },
  });
}

function say(text, retried = false) {
  if (!session) { log("say ignored: voice not connected"); return; }
  if (out.state !== "running") out.resume();  // autoplay policies start audio suspended
  if (!retried) stopPlayback();
  line += 1; playingLine = line; turnDone = false; said = "";
  gate = { chunks: [], timer: null, text, retried, open: false };
  handUp = false;
  setState("speaking", "Speaking", text.slice(0, 160));
  session.sendClientContent({ turns: [{ role: "user", parts: [{ text }] }], turnComplete: true });
}

// ---- the mind's commands ----
function connectMind() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/voice/ws?token=${token}`);
  ws.onopen = () => { log("mind connected"); idle(); };
  ws.onmessage = (e) => {
    const cmd = JSON.parse(e.data);
    if (cmd.type === "say") say(cmd.text);
    else if (cmd.type === "stop") { log("stop (someone started talking)"); line += 1; stopPlayback(); }
    else if (cmd.type === "hand") { handUp = cmd.up; handPoint = cmd.point || ""; if (!playingLine) idle(); }
  };
  ws.onclose = () => setTimeout(connectMind, 1000);
}

connectMind();
connectVoice().catch((e) => { log(`voice failed: ${e}`); setState("error", "Voice error", String(e).slice(0, 120)); });
</script>
</body>
</html>
